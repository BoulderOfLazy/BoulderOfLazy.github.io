name: Update game prices and reviews

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-game-prices
  cancel-in-progress: false

jobs:
  refresh-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh store prices and reviews
        run: python scripts/update_game_prices.py

      - name: Commit catalog changes
        run: |
          git add --update -- vr-stuff/games vr_games_list.html
          if git diff --cached --quiet; then
            echo "No catalog changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update game prices and reviews"
          git push
